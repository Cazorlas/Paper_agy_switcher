[package]
name = "paper-agy-switch"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Google Antigravity (agy CLI and desktop) account switcher - multi-profile manager with quota dashboard"
license = "Apache-2.0"
repository = "https://github.com/Cazorlas/Paper_agy_switcher"
keywords = ["antigravity", "agy", "gemini", "account", "switcher"]
categories = ["command-line-utilities"]

[lib]
name = "agy_switch"
path = "src/lib.rs"

[[bin]]
name = "paper-agy-switch"
test = false

[dependencies]
base64 = "0.23"
sha2 = "=0.11.1"
getrandom = "=0.3.4"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "7"
semver = "1"
reqwest = { version = "0.12", features = [
    "json",
    # Both root stores, not one: the OS trust store is what makes an
    # intercepting proxy's CA work the way it already does for curl and the
    # browser, while the bundled Mozilla list keeps a slim container that ships
    # no ca-certificates from losing HTTPS entirely.
    "rustls-tls-native-roots",
    "rustls-tls-webpki-roots",
    "socks",
    # Off by default here because default-features is disabled; without it a
    # macOS user whose proxy lives in System Settings (rather than in the
    # environment or --proxy) gets connection failures the browser does not.
    "macos-system-configuration",
], default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.30"
crossterm = "0.29"
toml = "1"
fs4 = "1.1.0"
chrono = { version = "0.4", features = ["clock"] }
supports-color = "3"
owo-colors = "4"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
] }

[dev-dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["clock"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
